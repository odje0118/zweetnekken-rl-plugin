name: Build and test

on:
  push:
    branches: [main, "release/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run tests and build plugin
        run: ./gradlew clean test build shadowJar
      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: zweetnekken-runelite-plugin
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
